services:
  backend:
    build:
      context: ../backend_dashboard
    env_file:
      - ../backend_dashboard/.env
    environment:
      PORT: "8000"
      DASHBOARD_ALLOWED_HOSTS: backend,localhost,127.0.0.1
      DASHBOARD_CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: .
    env_file:
      - .env.local
    environment:
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      APP_BASE_URL: http://localhost:3000
      DASHBOARD_API_BASE_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
